title: 杨翔瑞
description: 国防科技大学计算机学院副教授，研究方向为可编程数据平面、时间敏感网络（TSN）与网内计算
author: 杨翔瑞（Xiangrui Yang）
baseurl: ""
url: "https://winters123.github.io"

repository: Winters123/winters123.github.io

lang: zh-CN

keywords: 计算机网络, 可编程网络, 时间敏感网络, 高性能网络, FPGA, networking, programmable networks, TSN, high-performance networks

timezone: Asia/Shanghai

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 5
paginate_path: "/blog/page:num/"

collections:
  projects:
    output: true
    permalink: /projects/:path

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - LICENSE
  - README.md

include:
  - _pages
