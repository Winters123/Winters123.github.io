<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="{{ site.author }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
    {% seo %}
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
            </div>
            <ul class="nav-links">
                <li><a href="{{ '/' | relative_url }}">首页</a></li>
                <li><a href="{{ '/publications/' | relative_url }}">论文</a></li>
                <li><a href="{{ '/projects/' | relative_url }}">项目</a></li>
                <li><a href="{{ '/teaching/' | relative_url }}">教学</a></li>
                <li><a href="{{ '/cv/' | relative_url }}">简历</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ 'now' | date: "%Y" }} 杨翔瑞（Xiangrui Yang）· 保留所有权利</p>
        <p>国防科技大学计算机学院 · 长沙</p>
    </footer>
</body>
</html>
